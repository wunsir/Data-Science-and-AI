<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="基于三家招聘平台职位样本的岗位结构与薪资差异分析">
    <title>招聘市场的岗位结构与薪资差异</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/story.css">
</head>
<body class="home-page" data-page="home">
    <div id="app" v-cloak>
        <nav class="site-nav">
            <div class="nav-inner">
                <a class="nav-brand" href="./index.html">Labor Market Data Analysis</a>
                <div class="desktop-nav" aria-label="页面导航">
                    <a v-for="item in navigation" :key="item.page" class="nav-link"
                       :class="{ 'is-active': isActive(item.page) }" :href="item.href">{{ item.label }}</a>
                </div>
                <button class="menu-button" type="button" aria-controls="mobile-menu"
                        :aria-expanded="menuOpen" @click="menuOpen = !menuOpen">菜单 <span aria-hidden="true">↓</span></button>
            </div>
            <div id="mobile-menu" v-show="menuOpen" class="mobile-menu">
                <a v-for="item in navigation" :key="'mobile-' + item.page"
                   :class="{ 'is-active': isActive(item.page) }" :href="item.href">{{ item.label }}</a>
            </div>
        </nav>

        <header class="hero-bg">
            <canvas id="particle-canvas" aria-hidden="true"></canvas>
            <div class="hero-content">
                <h1 class="hero-enter">招聘市场的岗位结构<br>与薪资差异</h1>
                <p class="hero-subtitle hero-enter hero-delay-1">{{ data.subtitle }}</p>
                <div class="hero-tags hero-enter hero-delay-2" aria-label="数据概况">
                    <span v-for="tag in heroTags" :key="tag.label" class="hero-tag">{{ tag.label }}</span>
                </div>
                <div class="hero-source hero-enter hero-delay-3">
                    <a href="https://github.com/wunsir/big-data-project" target="_blank" rel="noreferrer">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path fill-rule="evenodd" d="M12 2C6.48 2 2 6.49 2 12.03c0 4.43 2.87 8.19 6.84 9.51.5.09.68-.22.68-.48 0-.24-.01-.87-.01-1.71-2.78.61-3.37-1.35-3.37-1.35-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.04 1.53 1.04.89 1.53 2.34 1.09 2.91.84.09-.65.35-1.09.64-1.34-2.22-.26-4.56-1.12-4.56-4.96 0-1.1.39-1.99 1.03-2.69-.1-.26-.45-1.28.1-2.66 0 0 .84-.27 2.75 1.03A9.6 9.6 0 0 1 12 6.85c.85 0 1.71.12 2.5.34 1.91-1.3 2.75-1.03 2.75-1.03.55 1.38.2 2.4.1 2.66.64.7 1.03 1.59 1.03 2.69 0 3.85-2.34 4.7-4.57 4.95.36.31.68.92.68 1.86 0 1.34-.01 2.42-.01 2.75 0 .27.18.58.69.48A10.04 10.04 0 0 0 22 12.03C22 6.49 17.52 2 12 2Z" clip-rule="evenodd"/>
                        </svg>
                        <span>查看项目源代码</span>
                    </a>
                </div>
            </div>
            <button class="scroll-indicator" type="button" @click="scrollToContent" aria-label="滚动到研究概览">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M19 14l-7 7m0 0l-7-7m7 7V3"/>
                </svg>
                <span>Scroll to explore</span>
            </button>
        </header>

        <main id="overview" class="index-content-layer">
            <div class="index-inner-content">
                <section class="overview-section reveal">
                    <h2>{{ data.overviewTitle }}</h2>
                    <div class="overview-copy">
                        <p v-for="paragraph in data.overview" :key="paragraph">{{ paragraph }}</p>
                        <div class="finding-box">
                            <h3>从样本中可以先看到两点：</h3>
                            <ul>
                                <li v-for="item in data.highlights" :key="item">{{ item }}</li>
                            </ul>
                        </div>
                    </div>
                </section>

                <section class="entry-grid reveal" aria-label="分析页面入口">
                    <a v-for="card in data.cards" :key="card.href" :href="card.href"
                       class="entry-card" :class="card.tone">
                        <div class="entry-visual">
                            <svg v-if="card.icon === 'bars'" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 20V10m5 10V4m6 16v-7m5 7V7"/>
                            </svg>
                            <svg v-else fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                <circle cx="6" cy="12" r="2.3" stroke-width="1.5"/>
                                <circle cx="18" cy="6" r="2.3" stroke-width="1.5"/>
                                <circle cx="18" cy="18" r="2.3" stroke-width="1.5"/>
                                <path stroke-width="1.5" d="m8.1 10.9 7.7-3.8M8.1 13.1l7.7 3.8"/>
                            </svg>
                        </div>
                        <div class="entry-body">
                            <h3>{{ card.title }}</h3>
                            <p>{{ card.text }}</p>
                            <span class="entry-action">
                                {{ card.action }}
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m9 18 6-6-6-6"/>
                                </svg>
                            </span>
                        </div>
                    </a>
                </section>
            </div>
        </main>

        <footer class="site-footer">
            <p>© 2025 Big Data Project · ZZH, CZW, LTY, WKZ</p>
        </footer>
    </div>
    <script type="module" src="./js/story-app.js"></script>
</body>
</html>
