<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交互图</title>
    <style>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
        html, body, #chart { width: 100%; height: 100%; margin: 0; }
        body { overflow: hidden; color: #334155; background: #fff; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
        #chart { min-height: 420px; }
        .chart-status { position: fixed; inset: 0; display: grid; place-items: center; padding: 2rem; color: #64748b; text-align: center; background: #fff; }
        .chart-status[hidden] { display: none; }
    </style>
</head>
<body>
    <div id="chart" role="img" aria-label="交互数据图"></div>
    <div id="chart-status" class="chart-status">正在加载图表…</div>
    <script src="./js/vendor/echarts.min.js"></script>
    <script type="module" src="./js/charts.js"></script>
</body>
</html>
